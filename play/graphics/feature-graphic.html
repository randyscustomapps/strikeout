<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Strikeout Harvest feature graphic</title>
<style>
@font-face{font-family:"Barlow";font-style:normal;font-weight:500;font-display:block;src:url("../../fonts/barlow-latin-500.woff2") format("woff2")}
@font-face{font-family:"Big Shoulders Display";font-style:normal;font-weight:900;font-display:block;src:url("../../fonts/big-shoulders-display-latin-900.woff2") format("woff2")}
html,body{margin:0;width:1024px;height:500px;overflow:hidden;background:#2A1D0A}
.wrap{
  width:1024px;height:500px;box-sizing:border-box;
  display:flex;align-items:center;justify-content:center;gap:28px;
  padding:36px 64px 36px 28px;
}
/* icon-512.png is the combine over the lockup. This window shows the combine only. */
.rig{width:440px;height:246px;flex:none;overflow:hidden;position:relative}
.rig img{position:absolute;width:700px;height:700px;left:50%;top:-168px;transform:translateX(-50%);display:block}
.lock{display:flex;flex-direction:column;align-items:stretch;min-width:0}
.name{
  margin:0;
  font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  font-weight:900;
  font-size:84px;
  line-height:.86;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:#FFD968;
}
.subrow{display:flex;align-items:center;gap:14px;margin-top:16px;color:#E0A91C}
.subrow i{flex:1;height:2px;background:currentColor;display:block}
.sub{
  font-family:"Barlow","Segoe UI",Roboto,sans-serif;
  font-weight:500;
  font-size:28px;
  letter-spacing:.16em;
  text-transform:uppercase;
  line-height:1;
  padding-left:.16em;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="rig" aria-hidden="true">
    <img src="../../icon-512.png" alt="">
  </div>
  <div class="lock">
    <h1 class="name">Strikeout</h1>
    <div class="subrow"><i></i><span class="sub">Harvest</span><i></i></div>
  </div>
</div>
</body>
</html>
