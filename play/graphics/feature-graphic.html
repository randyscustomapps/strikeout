<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Strikeout feature graphic</title>
<style>
@font-face{font-family:"Barlow";font-style:normal;font-weight:600;font-display:block;src:url("../../fonts/barlow-latin-600.woff2") format("woff2")}
@font-face{font-family:"Big Shoulders Display";font-style:normal;font-weight:800;font-display:block;src:url("../../fonts/big-shoulders-display-latin-800.woff2") format("woff2")}
html,body{margin:0;width:1024px;height:500px;overflow:hidden;background:#2A1D0A}
.wrap{
  width:1024px;height:500px;box-sizing:border-box;
  display:flex;align-items:center;gap:8px;
  padding:28px 64px 28px 20px;
}
img{width:444px;height:444px;flex:none;display:block}
.copy{min-width:0}
h1{
  margin:0;
  font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  font-weight:800;
  font-size:92px;
  line-height:.86;
  letter-spacing:.045em;
  text-transform:uppercase;
  color:#F2DFA7;
}
.rule{width:132px;height:5px;margin:18px 0 0;background:#F2B61F;border:0}
p{
  margin:16px 0 0;
  font-family:"Barlow","Segoe UI",Roboto,sans-serif;
  font-weight:600;
  font-size:28px;
  line-height:1.25;
  color:#E0A91C;
}
</style>
</head>
<body>
<div class="wrap">
  <img src="../../icon-512.png" alt="">
  <div class="copy">
    <h1>Strikeout</h1>
    <hr class="rule">
    <p>Lines to skip.<br>Nudge to finish flush.</p>
  </div>
</div>
</body>
</html>
