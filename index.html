<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2DFA7">
<meta name="description" content="Strikeout Harvest for Android. Get it on Google Play.">
<meta name="apple-mobile-web-app-title" content="Strikeout">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Strikeout Harvest</title>
<style>
@font-face{font-family:"Barlow";font-style:normal;font-weight:500;font-display:swap;src:url("fonts/barlow-latin-500.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Barlow";font-style:normal;font-weight:700;font-display:swap;src:url("fonts/barlow-latin-700.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Big Shoulders Display";font-style:normal;font-weight:800;font-display:swap;src:url("fonts/big-shoulders-display-latin-800.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{color-scheme:light;--bg:#F2DFA7;--ink:#2A1D0A;--muted:#6E5731;--on:#2A1D0A;--on-ink:#FFD968}
@media (prefers-color-scheme: dark){
  :root{color-scheme:dark;--bg:#0C0904;--ink:#D9BE85;--muted:#8F7A52;--on:#D9BE85;--on-ink:#0C0904}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow","Segoe UI",Roboto,system-ui,sans-serif}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:calc(28px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px));text-align:center}
.logo{width:min(72vw,280px);height:auto;display:block}
p{margin:0;max-width:28rem;font-size:1.2rem;line-height:1.4;color:var(--muted)}
.go{display:flex;align-items:center;justify-content:center;width:min(100%,440px);min-height:84px;padding:12px 22px;border-radius:14px;background:var(--on);color:var(--on-ink);font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;font-weight:800;font-size:2rem;letter-spacing:.06em;text-transform:uppercase;text-decoration:none}
.go:active{transform:scale(.98)}
.go:focus-visible{outline:3px solid var(--on);outline-offset:4px}
.fine{font-size:1rem}
.fine a{color:var(--ink);font-weight:700}
</style>
</head>
<body>
<main>
  <img class="logo" src="icon-512.png" alt="Strikeout Harvest" width="512" height="512">
  <p>The lead combine's line and nudge, on Android.</p>
  <a class="go" href="https://play.google.com/store/apps/details?id=com.randyscustomapps.strikeout">Get it on Google Play</a>
  <p class="fine"><a href="privacy.html">Privacy</a></p>
</main>
<script>
const APP_VERSION='1.0.80';
if(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'){
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
</body>
</html>
